<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston Real Estate AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.1em;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95em;
            color: var(--text-main);
        }

        .input-group label span {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.85em;
            margin-left: 5px;
        }

        .input-group input, .input-group select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 1.05em;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
            appearance: none; /* Removes default browser dropdown arrow for a cleaner look */
            cursor: pointer;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        /* Add a custom dropdown arrow using a background image for select elements */
        .input-group select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        .input-group select option {
            background-color: var(--bg-color); /* Fallback for older browsers */
            color: var(--text-main);
        }

        .input-group input::placeholder {
            color: rgba(148, 163, 184, 0.4);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.2em;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.6);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .result-container {
            margin-top: 30px;
            text-align: center;
        }

        .result-text {
            display: inline-block;
            font-size: 1.5em;
            font-weight: 600;
            padding: 20px 40px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 16px;
            color: #34d399;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Boston Real Estate AI</h1>
        <p>A demonstration of backend data injection.<br>Enter 4 basic fields, and the AI handles the rest.</p>
    </div>

    <form action="{{ url_for('predict')}}" method="post">
        <div class="form-grid">
            <div class="input-group">
                <label>Property Size <span>(Total Rooms)</span></label>
                <select name="RM" required="required">
                    <option value="" disabled selected>Select size...</option>
                    <option value="3">3 Rooms (Small)</option>
                    <option value="5">5 Rooms (Medium)</option>
                    <option value="7">7 Rooms (Large)</option>
                    <option value="9">9+ Rooms (Mansion)</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Neighborhood Style <span>(Average Age)</span></label>
                <select name="Age" required="required">
                    <option value="" disabled selected>Select neighborhood...</option>
                    <option value="10">Brand New Development</option>
                    <option value="50">Established Suburb</option>
                    <option value="90">Historic District</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Location <span>(Commute Distance)</span></label>
                <select name="DIS" required="required">
                    <option value="" disabled selected>Select location...</option>
                    <option value="1.5">Downtown / Urban Center</option>
                    <option value="5.0">Close Suburbs (Short Commute)</option>
                    <option value="10.0">Far Suburbs (Quiet / Rural)</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Local Tax Bracket <span>(Property Tax)</span></label>
                <select name="TAX" required="required">
                    <option value="" disabled selected>Select tax zone...</option>
                    <option value="250">Low Tax Zone</option>
                    <option value="400">Standard Tax Zone</option>
                    <option value="650">Premium Tax Zone</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Run AI Valuation</button>
        </div>
    </form>

    {% if prediction_text %}
    <div class="result-container">
        <div class="result-text">
            {{ prediction_text }}
        </div>
    </div>
    {% endif %}

</div>

</body>
</html>
