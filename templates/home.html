<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston Real Estate AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.1em;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95em;
            color: var(--text-main);
        }

        .input-group label span {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.85em;
            margin-left: 5px;
        }

        .input-group input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 1.05em;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        .input-group input::placeholder {
            color: rgba(148, 163, 184, 0.4);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.2em;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.6);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .result-container {
            margin-top: 30px;
            text-align: center;
        }

        .result-text {
            display: inline-block;
            font-size: 1.5em;
            font-weight: 600;
            padding: 20px 40px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 16px;
            color: #34d399;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Boston Real Estate AI</h1>
        <p>A demonstration of backend data injection.<br>Enter 4 basic fields, and the AI handles the rest.</p>
    </div>

    <form action="{{ url_for('predict')}}" method="post">
        <div class="form-grid">
            <div class="input-group">
                <label>Number of Rooms <span>(Average per dwelling)</span></label>
                <input type="text" name="RM" placeholder="e.g. 3" required="required" />
            </div>
            
            <div class="input-group">
                <label>House Age Rating <span>(% built before 1940)</span></label>
                <input type="text" name="Age" placeholder="e.g. 50" required="required" />
            </div>
            
            <div class="input-group">
                <label>Commute Distance <span>(Weighted distance to employment)</span></label>
                <input type="text" name="DIS" placeholder="e.g. 5.5" required="required" />
            </div>
            
            <div class="input-group">
                <label>Property Tax Rate <span>(Per $10,000)</span></label>
                <input type="text" name="TAX" placeholder="e.g. 300" required="required" />
            </div>

            <button type="submit" class="submit-btn">Run AI Valuation</button>
        </div>
    </form>

    {% if prediction_text %}
    <div class="result-container">
        <div class="result-text">
            {{ prediction_text }}
        </div>
    </div>
    {% endif %}

</div>

</body>
</html>
